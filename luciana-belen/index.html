  :root {

  body {

  .card {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    opacity: 0;
    transform: translateY(8px);
    animation: rise 0.5s ease-out forwards;
  }

  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; opacity: 1; transform: none; }

  .identity { display: flex; flex-direction: column; gap: 10px; }

  /* Encabezado "avatar": foto circular pequeña (patrón Madeleine) */
  .avatar {

    height: 92px;
    border-radius: 50%;
    object-fit: cover;
    object-position: 50% 22%;
    display: block;
    margin-bottom: 4px;
    box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--line);
  }

  /* Encabezado "retrato": el rostro ocupa el ancho de la tarjeta */
  .portrait {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: 50% 22%;
    display: block;
    margin-bottom: 14px;
    background: var(--accent-tint);
  }

  h1 {

  }

  h1.caps {

  }

  .specialty {

    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;

  }

  .tagline {

  }

  .links { display: flex; flex-direction: column; gap: 10px; }

  .link-row {

    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 2px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }

  .link-row:hover { border-color: var(--accent-deep); background: var(--accent-tint); }
  .link-row:active { transform: scale(0.99); }
  .link-row:focus-visible { outline: 2px solid var(--accent-deep); outline-offset: 2px; }

  .link-row.primary {

  }

    justify-content: center;
    color: var(--accent-deep);
  }

  .link-row.primary .link-icon { color: var(--on-accent); }
  .link-icon svg { width: 100%; height: 100%; }

  .link-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .link-label { font-size: 15px; font-weight: 500; letter-spacing: 0.01em; }

  .link-sub {
    font-size: 13px;
    font-weight: 300;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link-row.primary .link-sub { color: var(--on-accent); opacity: 0.8; font-weight: 400; }

  .link-arrow { margin-left: auto; flex: none; color: var(--ink-faint); }
  .link-row.primary .link-arrow { color: var(--on-accent); opacity: 0.7; }

  footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding-top: 6px;
    text-align: center;
  }

  footer .rule { width: 32px; height: 1px; background: var(--line); margin-bottom: 6px; }

    font-size: 11.5px;
    font-weight: 300;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>

<script>
  // Se desregistra cualquier service worker viejo y se registra la versión
  // nueva, sin caché: esto es lo que hace que Android reconozca la página
  // como instalable (ícono propio + pantalla completa) en vez de un simple
  // acceso directo con el logo de Chrome.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    }).then(() => {
      if (window.caches) { caches.keys().then(keys => keys.forEach(k => caches.delete(k))); }
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
