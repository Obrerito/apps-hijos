<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>{{nombre}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="{{descripcion}}">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{nombre_app}}">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="{{fondo}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?{{google_fonts}}&display=swap" rel="stylesheet">

<style>
  /* Generado por herramientas/generar.py a partir de datos.json.
     Para cambiar algo, se edita datos.json y se vuelve a generar. */
  :root {
    --bg: {{fondo}};
    --surface: {{superficie}};
    --ink: {{tinta}};
    --ink-soft: {{tinta_suave}};
    --ink-faint: {{tinta_tenue}};
    --accent: {{acento}};
    --accent-deep: {{acento_oscuro}};
    --accent-tint: {{acento_tinte}};
    --line: {{linea}};
    --on-accent: {{texto_sobre_acento}};
    --font-title: "{{fuente_titulo}}", Georgia, "Times New Roman", serif;
    --font-text: "{{fuente_texto}}", -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-text);
    font-weight: 400;
    display: flex;
    justify-content: center;
    padding: clamp(18px, 5vw, 48px) 18px 40px;
    padding-top: max(clamp(18px, 5vw, 48px), env(safe-area-inset-top));
  }

  .card {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    opacity: 0;
    transform: translateY(8px);
    animation: rise 0.5s ease-out forwards;
  }

  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; opacity: 1; transform: none; }
  }

  .identity { display: flex; flex-direction: column; gap: 10px; }

  /* Encabezado "avatar": foto circular pequeña (patrón Madeleine) */
  .avatar {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    object-fit: cover;
    object-position: {{foto_encuadre}};
    display: block;
    margin-bottom: 4px;
    box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--line);
  }

  /* Encabezado "retrato": el rostro ocupa el ancho de la tarjeta */
  .portrait {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: {{foto_encuadre}};
    display: block;
    margin-bottom: 14px;
    background: var(--accent-tint);
  }

  h1 {
    font-family: var(--font-title);
    font-weight: 400;
    font-size: clamp(28px, 7vw, 34px);
    line-height: 1.12;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }

  h1.caps {
    font-weight: 300;
    font-size: clamp(34px, 10.5vw, 46px);
    line-height: 1.08;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .specialty {
    margin: 0;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent-deep);
  }

  .tagline {
    margin: 0;
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink-soft);
    max-width: 34ch;
  }

  .links { display: flex; flex-direction: column; gap: 10px; }

  .link-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 2px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }

  .link-row:hover { border-color: var(--accent-deep); background: var(--accent-tint); }
  .link-row:active { transform: scale(0.99); }
  .link-row:focus-visible { outline: 2px solid var(--accent-deep); outline-offset: 2px; }

  .link-row.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }

  .link-row.primary:hover { filter: brightness(0.96); background: var(--accent); }

  .link-icon {
    flex: none;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-deep);
  }

  .link-row.primary .link-icon { color: var(--on-accent); }
  .link-icon svg { width: 100%; height: 100%; }

  .link-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .link-label { font-size: 15px; font-weight: 500; letter-spacing: 0.01em; }

  .link-sub {
    font-size: 13px;
    font-weight: 300;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link-row.primary .link-sub { color: var(--on-accent); opacity: 0.8; font-weight: 400; }

  .link-arrow { margin-left: auto; flex: none; color: var(--ink-faint); }
  .link-row.primary .link-arrow { color: var(--on-accent); opacity: 0.7; }

  footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding-top: 6px;
    text-align: center;
  }

  footer .rule { width: 32px; height: 1px; background: var(--line); margin-bottom: 6px; }

  footer p {
    margin: 0;
    font-size: 11.5px;
    font-weight: 300;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="identity">
{{bloque_identidad}}
  </div>

  <nav class="links" aria-label="Formas de contacto">
{{bloque_enlaces}}
  </nav>

  <footer>
    <div class="rule"></div>
    <p>{{pie}}</p>
  </footer>
</div>

<script>
  // Se desregistra cualquier service worker viejo y se registra la versión
  // nueva, sin caché: esto es lo que hace que Android reconozca la página
  // como instalable (ícono propio + pantalla completa) en vez de un simple
  // acceso directo con el logo de Chrome.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    }).then(() => {
      if (window.caches) { caches.keys().then(keys => keys.forEach(k => caches.delete(k))); }
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
